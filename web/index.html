<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="description" content="80 лет Петру Табакову">
    <meta name="theme-color" content="#0b0b0d">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>80 лет Петру Табакову</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div id="viewer">
        <div id="carousel-viewport">
            <div id="carousel-track" aria-live="polite">
                <section class="slide-slot" data-slot="previous"></section>
                <section class="slide-slot" data-slot="current"></section>
                <section class="slide-slot" data-slot="next"></section>
            </div>
        </div>
        <div id="counter">0 / 0</div>
        <div id="loader">Загрузка...</div>
        <div class="slide-indicator" aria-hidden="true">
            <span id="prev-indicator">←</span>
            <span id="next-indicator">→</span>
        </div>
    </div>
    <script src="/js/viewer.js"></script>
</body>
</html>
